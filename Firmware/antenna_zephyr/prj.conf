# Antenna V5 - STM32F103C8 Blue Pill, Zephyr 3.7
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_I2C=y
CONFIG_I2C_STM32_BUS_RECOVERY=y
CONFIG_PWM=y
CONFIG_COUNTER=y
CONFIG_WATCHDOG=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_CRC=y
CONFIG_RING_BUFFER=y
# link inside code_partition (0..60K); the last 4K hold the NVS parameters
CONFIG_USE_DT_CODE_PARTITION=y

# The UART carries the command/telemetry protocol only.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_ASSERT=n

# Control loop runs in the main thread (priority 2 preemptible), 100 Hz k_timer.
CONFIG_MAIN_THREAD_PRIORITY=2
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=320
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_SIZE_OPTIMIZATIONS=y
